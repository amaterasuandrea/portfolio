  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  
  <!-- Cinematic Letterbox Grid -->
  <line x1="0" y1="140" x2="1920" y2="140" stroke="#8B5CF6" stroke-opacity="0.15" stroke-dasharray="8 8"/>
