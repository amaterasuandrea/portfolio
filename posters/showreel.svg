  <circle cx="960" cy="540" r="4" fill="#8B5CF6"/>
  <line x1="940" y1="540" x2="980" y2="540" stroke="#8B5CF6" stroke-width="1"/>
  <line x1="960" y1="520" x2="960" y2="560" stroke="#8B5CF6" stroke-width="1"/>

